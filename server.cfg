###############################################################################
#  Strata Framework · server entrypoint
#
#  This file is intentionally minimal — everything substantive lives in
#  `cfg/`, one file per concern. The exec order below matters:
#
#    1. identity     · bind the server's hostname / network / locale / icon
#    2. secrets      · license key + DB connection                (gitignored)
#    3. runtime      · engine knobs (onesync, game build, etc.)
#    4. convars      · framework + Strata convars resources read at boot
#    5. permissions  · ACE rules + staff-tier inheritance
#    6. principals   · real-player → staff-tier assignments       (gitignored)
#    7. resources    · resource start order, grouped by dependency layer
#
#  First-time setup:
#    cp cfg/secrets.cfg.example    cfg/secrets.cfg     # license + DB
#    cp cfg/principals.cfg.example cfg/principals.cfg  # staff assignments
#
#  Docs: https://docs.fivem.net/docs/server-manual/setting-up-a-server/
###############################################################################

exec cfg/identity.cfg
exec cfg/secrets.cfg
exec cfg/runtime.cfg
exec cfg/convars.cfg
exec cfg/permissions.cfg
exec cfg/principals.cfg
exec cfg/resources.cfg
