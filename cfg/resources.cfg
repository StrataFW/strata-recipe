###############################################################################
#  resources.cfg · Resource start order
#
#  Grouped by dependency layer; each layer's dependencies finish booting
#  before the next layer starts. The default `chat` resource is intentionally
#  NOT started — st_chat replaces it (and the st_chat server script stops it
#  defensively if anything else starts it).
###############################################################################

## 1. Always-on system ─────────────────────────────────────────────────────
ensure sessionmanager


## 2. Strata foundation ────────────────────────────────────────────────────
#  st_log first so every downstream resource can `@st_log/lib/init.lua`.
start st_log

#  st_bootstrap early so players see the branded loadscreen immediately.
start st_bootstrap


## 3. Vendor ───────────────────────────────────────────────────────────────
start pma-voice
start screenshot-basic


## 4. OX ecosystem (lib → core → consumers) ───────────────────────────────
start oxmysql
start ox_lib
start ox_core
start ox_target
start ox_inventory
start ox_banking
start ox_commands
start ox_doorlock
start ox_fuel


## 5. Streamed maps / interiors ────────────────────────────────────────────
#  Paid/third-party MLOs — uncomment per deployment. Must start before any
#  resource that targets their coords (e.g. st_apartments needs
#  kiiya_lapuerta's La Puerta MLO loaded before placing its zones).
# start kiiya_lapuerta


## 6. Strata gameplay ──────────────────────────────────────────────────────
start st_ipl
start st_appearance
start st_multichar
start st_spawn
start st_apartments
start st_chat
start st_ui
start st_admin


## 7. Graphics / visual overhaul ───────────────────────────────────────────
#  Paid asset pack — uncomment per deployment. Loads last so it can patch on
#  top of everything else.
# start [assets_corefx]
