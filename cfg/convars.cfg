###############################################################################
#  convars.cfg · Framework + Strata convars (read by resources at boot)
#
#  Grouped:
#    1. OX stack       — ox_core / ox_inventory feature toggles
#    2. Strata core    — environment + debug switches
#    3. st_bootstrap   — loadscreen control
#    4. st_log         — optional logging knobs (all defaults shown)
###############################################################################

## OX stack ────────────────────────────────────────────────────────────────────

# Display language (currently only en).
setr ox:locale "en"

# st_multichar replaces ox_core's built-in selector — leave this off.
setr ox:characterSelect 0

# Per-account character slot limit. ox_core defaults to 1, which silently
# blocks creating any 2nd character (createCharacter early-returns, no event
# fires back, multichar hangs on "Creating"). Keep this in sync with
# st_multichar's Config.MaxSlots.
setr ox:characterSlots 4

# st_ui owns the death + respawn flow (countdown overlay, MINUS keybind,
# hand-off to st_spawn). ox_core's built-in DEATH_SYSTEM bleeds the player
# out after a tick budget and auto-revives — leave this off so st_ui's
# overlay isn't dismissed under us.
setr ox:deathSystem 0

# Enable third-eye-style targeting for ox_inventory item interactions.
setr inventory:target true


## Strata core ────────────────────────────────────────────────────────────────

# Environment label shown in the st_bootstrap banner.
# Common values: development | staging | production
set st:env "development"

# Master debug switch — enables Log.debug() output across all resources.
# Can also be toggled at runtime via the `logdebug on/off` console command.
setr st:debug 0


## st_bootstrap ──────────────────────────────────────────────────────────────

# Bypass st_bootstrap's auto-dismiss on `playerSpawned` /
# `ox:startCharacterSelect`. When 1, callers must invoke
# `exports.st_bootstrap:shutdown()` themselves.
setr st_bootstrap:manualShutdown 0


## st_log ─ optional knobs (defaults shown — uncomment + edit to override) ───

# Daily rotating text log on disk
# setr st:log:file 1

# NDJSON sidecar log alongside the text log
# setr st:log:json 0

# Min console level — debug | info | warn | error
# setr st:log:level "info"

# Rotate the log file when it crosses this size (MB)
# setr st:log:max_size_mb 10

# Delete rolled log files older than this (days). 0 = no retention sweep.
# setr st:log:retention_days 30

# Strip secrets (bearer tokens, mysql passwords, etc.) from log output
# setr st:log:redact 1

# Discord webhook URL — empty disables webhook forwarding entirely
# setr st:log:webhook ""

# Min level forwarded to Discord — debug | info | warn | error
# setr st:log:webhook_level "warn"
