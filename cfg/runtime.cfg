###############################################################################
#  runtime.cfg · FXServer engine knobs
###############################################################################

## Game state

# OneSync — required by ox_core and every Strata resource that declares
# /onesync as a dependency. Setting this explicitly avoids depending on
# txAdmin / launch args, which is fragile for bundle deployment.
# Valid: off | legacy | on
## [txAdmin CFG validator]: onesync MUST only be set in the txAdmin settings page.
# set onesync on

# Pinned game build. Bumping this forces every connecting client onto the
# new build — coordinate with the team before changing.
# https://docs.fivem.net/docs/server-manual/server-commands/#sv_enforcegamebuild-build
set sv_enforceGameBuild 3258

# https://docs.fivem.net/docs/server-manual/server-commands/#sv_filterrequestcontrol-mode
set sv_filterRequestControl -1


## Console / loadscreen

# Quiet the per-resource "Started resource X" boot spam. Best-effort — older
# FXServer builds ignore it. st_bootstrap's boot summary card fills the gap.
set con_miniconChannels "script:*"

# Kill the engine's busy-spinner overlay during connect/spawn so
# st_bootstrap's loadscreen is the only thing on screen.
setr sv_showBusySpinnerOnLoadingScreen false


## Master list

# Skip public server-list registration. Without this the engine repeatedly
# tries to reach <endpoint>/info.json|/players.json|/dynamic.json and spams
# "Server list query returned an error: context deadline exceeded" on dev
# boxes that aren't port-forwarded. Comment out to publish the server.
set sv_master1 ""
