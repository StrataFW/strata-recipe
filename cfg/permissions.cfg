###############################################################################
#  permissions.cfg · ACE rules + Strata staff-tier inheritance
#
#  This file is impersonal — it defines WHAT each tier can do. The mapping
#  of real players → tiers lives in `principals.cfg` (gitignored).
###############################################################################

## Tier hierarchy ────────────────────────────────────────────────────────────
#  Tiers, highest → lowest:
#    group.dev > group.sudo > group.admin > group.mod > group.jrmod
#
#  Higher tiers inherit everything below them via the principal chain — a
#  `group.dev` principal also gets every sudo/admin/mod/jrmod permission.
add_principal group.dev   group.sudo
add_principal group.sudo  group.admin
add_principal group.admin group.mod
add_principal group.mod   group.jrmod


## Tier self-ACEs ────────────────────────────────────────────────────────────
#  Required for `IsPlayerAceAllowed(src, 'group.X')` to return true based on
#  principal membership alone. Without these, principals work for inheritance
#  but the membership check that st_admin (and most tier-checking resources)
#  rely on returns false. Each tier "owns" its own name as an allow ACE.
add_ace group.dev   group.dev   allow
add_ace group.sudo  group.sudo  allow
add_ace group.admin group.admin allow
add_ace group.mod   group.mod   allow
add_ace group.jrmod group.jrmod allow


## Command access ────────────────────────────────────────────────────────────
#  Lets group.admin (and inheriting tiers) invoke any registered command.
add_ace group.admin command allow


## ox_lib admin commands ────────────────────────────────────────────────────
add_ace resource.ox_lib command.add_ace          allow
add_ace resource.ox_lib command.remove_ace       allow
add_ace resource.ox_lib command.add_principal    allow
add_ace resource.ox_lib command.remove_principal allow


## st_appearance ─────────────────────────────────────────────────────────────
#  Admin appearance editor + faction uniform management.
add_ace group.admin admin.appearance    allow
add_ace group.admin appearance.uniforms allow
